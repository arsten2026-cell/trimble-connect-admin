<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Администрация</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1f1f1f; --muted:#6b6b6b; --line:#d9d5cc; --accent:#E37424; --panel:#fff; --bad:#b3261e; --ok:#2E7D32; --warn:#C98A00; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--ink); font:13px/1.45 Ubuntu, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h2 { font-size:12px; margin:14px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .top h1 { margin-right:auto; }
  .status { font-size:12px; color:var(--muted); margin-bottom:8px; min-height:1.4em; }
  .status.bad { color:var(--bad); }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  button { font:inherit; padding:5px 9px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; border-radius:0; }
  button:disabled { opacity:.45; cursor:default; }
  button.secondary { background:transparent; color:var(--ink); border-color:var(--line); }
  button.small { padding:2px 8px; font-size:12px; }
  button.danger { background:var(--bad); border-color:var(--bad); }
  select { font:inherit; font-size:12px; padding:3px 5px; border:1px solid var(--line); background:#fff; border-radius:0; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .tabs button { background:transparent; color:var(--ink); border-color:var(--line); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .item { display:flex; gap:8px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c); padding:5px 8px; margin-bottom:4px; }
  .item.ok { --c:var(--ok); } .item.bad { --c:var(--bad); } .item.warn { --c:var(--warn); } .item.unknown { --c:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--c); margin-top:4px; flex:none; }
  .item .body { flex:1; min-width:0; }
  .sub { font-size:11px; color:var(--muted); }
  .bad { color:var(--bad); }
  .lines { font-size:11.5px; margin-top:2px; }
  .confirm { background:#fff6ee; border:1px solid var(--accent); padding:6px 8px; margin-top:6px; font-size:12px; }
  table { border-collapse:collapse; width:100%; background:var(--panel); font-size:12px; }
  th, td { border:1px solid var(--line); padding:3px 5px; text-align:left; vertical-align:top; }
  th { background:#ece8df; font-weight:600; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.hot { color:var(--bad); font-weight:600; }
  td.chg { background:#fff1e3; }
  tr.bad td { color:var(--bad); }
  .confirm table { margin:6px 0; }
  .mono { font-family:"Ubuntu Mono", Consolas, monospace; font-size:11px; word-break:break-all; }
  .feed .row { background:var(--panel); border:1px solid var(--line); padding:5px 8px; margin-bottom:4px; }
  .feed .row .hd { display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .feed .row .hd b { font-size:12.5px; }
  .feed .row > .sub { white-space:pre-line; }
  .tag { font-size:11px; padding:0 5px; border:1px solid var(--line); color:var(--muted); }
  .note { font-size:12px; background:var(--panel); border:1px solid var(--line); padding:6px 8px; margin:6px 0; }
  ol.help { margin:4px 0 0 18px; padding:0; font-size:12px; }
  /* touch screens (sweep 18.11.2026, as the other panels): ~40 px targets, 16 px inputs (no iOS zoom on focus) */
  @media (pointer: coarse) {
    button, button.small, select { min-height:40px; }
    button.small { padding:6px 12px; font-size:14px; }
    select { font-size:16px; padding:6px 8px; }
    .bar, .tabs { gap:8px; }
  }
</style>
</head>
<body>
<div class="top"><h1 id="title">Администрация</h1>
  <select id="selLang" title="Language / Език"><option value="bg">BG</option><option value="en">EN</option></select></div>
<button type="button" class="small secondary" data-arsten-diag style="float:right;margin-left:6px">Копирай диагностика</button>
<div id="status" class="status">Trimble Connect…</div>
<div id="main" hidden>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/trimble-connect-workspace-api@0.3.38/dist/iife/trimbleconnect.workspace.api.js" integrity="sha384-lFiNt/56q6HnUNbuy0WHO3NP6BkQjY4EH8+5eELYVfnhkB42snRTmSa3UOAlX9gg" crossorigin="anonymous"></script>
<script src="arsten-perf.js?v=21f7454938"></script>
<script src="arsten-diag.js?v=bb0c6351fe"></script>
<script src="arsten-i18n.js?v=c58f01c9fc"></script>
<script src="arsten-access.js?v=fad565fcbe"></script>
<script src="psetapi.js?v=970df94af2"></script>
<script src="status.js?v=5dfad10961"></script>
<script src="stages.js?v=c5f13f90f8"></script>
<script src="arsten-photos.js?v=58db357146"></script>
<script src="arsten-acceptance.js?v=f8e113bc4d"></script>
<script src="arsten-backup.js?v=6c54dfe763"></script>
<script src="records.js?v=a7ccda6573"></script>
<script src="fabrication.js?v=7108b8ac3e"></script>
<script src="expected.js?v=a05f583aae"></script>
<script src="health.js?v=1711b7d15b"></script>
<script src="app.js?v=62e6a1f8a4"></script>
</body>
</html>
